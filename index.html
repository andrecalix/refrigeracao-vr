<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLIMTECH VR | Bancada Realista</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #101827; color: white; font-family: Arial, sans-serif; }
  #painel {
    position: fixed; z-index: 5; top: 12px; left: 12px; width: min(390px, calc(100vw - 24px));
    padding: 16px; border-radius: 14px; background: rgba(13, 24, 42, .94);
    border: 1px solid #475569; pointer-events: auto;
  }
  h1 { margin: 0 0 5px; font-size: 23px; color: #67e8f9; }
  p { font-size: 14px; line-height: 1.45; margin: 8px 0; }
  button {
    border: 0; border-radius: 8px; padding: 10px; margin: 3px 2px;
    background: #0891b2; color: white; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #0e7490; }
  #estado { color: #dbeafe; min-height: 68px; }
</style>
</head>
<body>
<div id="painel">
  <h1>GLIMTECH VR (Bancada)</h1>
  <p><strong>Circuito de Refrigeração</strong></p>
  <div>
    <button onclick="mostrar('visao')">Visão geral</button>
    <button onclick="mostrar('compressor')">1. Compressor</button>
    <button onclick="mostrar('condensador')">2. Condensador</button>
    <button onclick="mostrar('filtro')">3. Filtro Capilar</button>
    <button onclick="mostrar('evaporador')">4. Evaporador</button>
  </div>
  <h2 id="titulo" style="font-size: 17px; margin: 10px 0 5px;">Ciclo de refrigeração</h2>
  <p id="estado">O refrigerante circula num sistema fechado. Olhe fixamente para um componente em VR para interagir.</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3b5c);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
const cameraGroup = new THREE.Group();
cameraGroup.position.set(0, 1.5, 6);
cameraGroup.add(camera);
scene.add(cameraGroup);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const luz = new THREE.DirectionalLight(0xffffff, 2);
luz.position.set(5, 10, 5);
scene.add(luz);

const material = (cor, metalness = 0.2, roughness = 0.8) => 
  new THREE.MeshStandardMaterial({ color: cor, metalness, roughness });

const matMadeira = material(0x5c3a21, 0.1, 0.9);
const matPreto = material(0x1a1a1a, 0.8, 0.2);
const matMetal = material(0xa0aab5, 0.9, 0.1);
const matAzul = material(0x0055ff, 0.5, 0.3);
const matVermelho = material(0xff3300, 0.5, 0.3);

const selecionaveis = [];
const objetosPorNome = {};

function criarComponente(nome, obj3D, posicao) {
  obj3D.position.set(...posicao);
  obj3D.userData = { componente: nome };
  scene.add(obj3D);
  selecionaveis.push(obj3D);
  objetosPorNome[nome] = obj3D;
  return obj3D;
}

// 1. Mesa de Madeira (Baseada na foto)
const mesa = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 5), matMadeira);
mesa.position.set(0, 0, 0);
scene.add(mesa);

// 2. Compressor (Preto, formato cúpula)
const compGroup = new THREE.Group();
const compBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 1.2, 32), matPreto);
const compTopo = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), matPreto);
compTopo.position.y = 0.6;
compGroup.add(compBase); compGroup.add(compTopo);
criarComponente('compressor', compGroup, [-3, 0.7, 0]);

// 3. Condensador (Grelha vertical laranja/vermelha)
const condGroup = new THREE.Group();
const condBase = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), matVermelho);
condGroup.add(condBase);
criarComponente('condensador', condGroup, [0, 1.6, -1.5]);

// 4. Evaporador (Balde metálico com serpentina azul)
const evapGroup = new THREE.Group();
const balde = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 1.5, 32, 1, true), matMetal);
balde.material.side = THREE.DoubleSide;
evapGroup.add(balde);
for(let i=0; i<5; i++) {
  const anel = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 16, 32), matAzul);
  anel.rotation.x = Math.PI / 2;
  anel.position.y = -0.5 + (i * 0.25);
  evapGroup.add(anel);
}
criarComponente('evaporador', evapGroup, [3, 0.8, 1]);

let painelInfo3D;
function criarPainelInfo() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0d182a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#67e8f9'; ctx.font = 'bold 50px Arial'; ctx.fillText('Bancada Didática', 30, 80);
  ctx.fillStyle = '#ffffff'; ctx.font = '35px Arial'; ctx.fillText('Use a mira do VR para focar nos componentes.', 30, 160);
  painelInfo3D = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
  painelInfo3D.position.set(0, 4, 0);
  scene.add(painelInfo3D);
}
criarPainelInfo();

// Sistema Gaze (Mira VR Zeiss)
const raycaster = new THREE.Raycaster();
const mira = new THREE.Mesh(new THREE.RingGeometry(0.015, 0.03, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthTest: false }));
mira.position.z = -1;
camera.add(mira); 

const info = {
  visao: { tit: 'Visão Geral', txt: 'Bancada didática. Foque nos componentes para ver detalhes.' },
  compressor: { tit: 'Compressor Hermético', txt: 'Coração do sistema (cúpula preta). Comprime o gás refrigerante.' },
  condensador: { tit: 'Condensador Estático', txt: 'Grelha traseira. Onde o gás quente perde calor para o ambiente.' },
  filtro: { tit: 'Tubo Capilar', txt: 'Fio de cobre fino que expande o fluido antes do evaporador.' },
  evaporador: { tit: 'Evaporador', txt: 'Serpentina azul no balde metálico onde ocorre a refrigeração da água.' }
};

let objFocado = null;
let tempoInicioFoco = 0;

window.mostrar = (nome) => {
  const d = info[nome] || info.visao;
  document.getElementById('titulo').textContent = d.tit;
  document.getElementById('estado').textContent = d.txt;
};

const botaoVR = VRButton.createButton(renderer);
document.body.appendChild(botaoVR);

const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const tempo = relogio.getElapsedTime();
  
  raycaster.setFromCamera({x: 0, y: 0}, camera);
  const intersects = raycaster.intersectObjects(selecionaveis, true);
  
  if (intersects.length > 0) {
    const alvo = intersects[0].object.parent.userData.componente ? intersects[0].object.parent : intersects[0].object;
    mira.scale.set(1.5, 1.5, 1.5);
    mira.material.color.setHex(0xf59e0b);
    
    if (alvo !== objFocado) {
      objFocado = alvo;
      tempoInicioFoco = tempo;
    } else if (tempo - tempoInicioFoco > 1.5) {
      window.mostrar(alvo.userData.componente);
      mira.material.color.setHex(0x10b981);
      tempoInicioFoco = tempo + 5; 
    }
  } else {
    mira.scale.set(1, 1, 1);
    mira.material.color.setHex(0xffffff);
    objFocado = null;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
